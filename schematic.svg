<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 1480" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1180" height="1480" fill="#0f1420"/>
  <text x="590" y="44" fill="#eaeef7" font-size="28" font-weight="700" text-anchor="middle">ESP32 + Dual nRF24L01+ PA/LNA — Carrier PCB</text>
  <text x="590" y="74" fill="#8ea2c0" font-size="16" text-anchor="middle">Schematic map (left) · Physical placement (right). Antennas on top edge, battery + USB-C on the back.</text>

  <!-- ============ LEFT: PIN MAP ============ -->
  <g>
    <!-- ESP32 block -->
    <rect x="430" y="160" width="300" height="620" rx="10" fill="#1b2435" stroke="#3b82f6" stroke-width="2"/>
    <text x="580" y="195" fill="#eaeef7" font-size="20" font-weight="700" text-anchor="middle">ESP32-WROOM-32 (U1)</text>
    <text x="580" y="218" fill="#8ea2c0" font-size="13" text-anchor="middle">soldered on carrier · 3.3 V logic</text>

    <!-- nRF1 block -->
    <rect x="60" y="230" width="250" height="230" rx="10" fill="#17231b" stroke="#22c55e" stroke-width="2"/>
    <text x="185" y="262" fill="#eaeef7" font-size="18" font-weight="700" text-anchor="middle">nRF24 #1 (U2) — VSPI</text>
    <text x="185" y="283" fill="#8ea2c0" font-size="12" text-anchor="middle">2×4 socket · antenna OUT</text>

    <!-- nRF2 block -->
    <rect x="60" y="520" width="250" height="230" rx="10" fill="#17231b" stroke="#22c55e" stroke-width="2"/>
    <text x="185" y="552" fill="#eaeef7" font-size="18" font-weight="700" text-anchor="middle">nRF24 #2 (U3) — HSPI</text>
    <text x="185" y="573" fill="#8ea2c0" font-size="12" text-anchor="middle">2×4 socket · antenna OUT</text>

    <!-- nRF1 lines -->
    <g font-size="14" fill="#cdd8ec">
      <text x="80" y="315">CE  → IO17</text>
      <text x="80" y="340">CSN → IO5</text>
      <text x="80" y="365">SCK → IO18</text>
      <text x="80" y="390">MOSI→ IO23</text>
      <text x="80" y="415">MISO→ IO19</text>
      <text x="80" y="440">IRQ → IO16</text>
    </g>
    <!-- nRF2 lines -->
    <g font-size="14" fill="#cdd8ec">
      <text x="80" y="605">CE  → IO26</text>
      <text x="80" y="630">CSN → IO15</text>
      <text x="80" y="655">SCK → IO14</text>
      <text x="80" y="680">MOSI→ IO13</text>
      <text x="80" y="705">MISO→ IO27</text>
      <text x="80" y="730">IRQ → IO25</text>
    </g>
    <!-- connector lines -->
    <g stroke="#22c55e" stroke-width="2" opacity="0.7">
      <path d="M310 345 H430" fill="none"/>
      <path d="M310 635 H430" fill="none"/>
    </g>
    <text x="370" y="338" fill="#22c55e" font-size="11" text-anchor="middle">6 signals</text>
    <text x="370" y="628" fill="#22c55e" font-size="11" text-anchor="middle">6 signals</text>

    <!-- shared 3v3/gnd to nRF -->
    <g font-size="12" fill="#ff6b6b">
      <text x="185" y="438" text-anchor="middle">VCC 3.3 V + 10µF</text>
    </g>
    <g font-size="12" fill="#ff6b6b">
      <text x="185" y="728" text-anchor="middle">VCC 3.3 V + 10µF</text>
    </g>

    <!-- Power chain -->
    <rect x="430" y="840" width="300" height="300" rx="10" fill="#241b2e" stroke="#a855f7" stroke-width="2"/>
    <text x="580" y="872" fill="#eaeef7" font-size="18" font-weight="700" text-anchor="middle">Power path</text>
    <g font-size="14" fill="#cdd8ec">
      <text x="450" y="905">18650 cell (BT1)  +  → </text>
      <text x="450" y="935">TP4056 USB-C (U4)  charge</text>
      <text x="450" y="965">→  SPDT switch (SW1)</text>
      <text x="450" y="995">→  3.3 V reg (U5)  ──► +3V3</text>
      <text x="450" y="1025">bulk 470 µF (C1) at ESP32</text>
    </g>
    <text x="450" y="1065" font-size="12" fill="#ffd166">⚠ 1 cell + 2 PA radios: use a</text>
    <text x="450" y="1085" font-size="12" fill="#ffd166">buck-boost (TPS63020) for stable</text>
    <text x="450" y="1105" font-size="12" fill="#ffd166">3.3 V down to 3.0 V battery.</text>

    <!-- Programming -->
    <rect x="770" y="230" width="340" height="230" rx="10" fill="#1b2435" stroke="#60a5fa" stroke-width="2"/>
    <text x="940" y="262" fill="#eaeef7" font-size="18" font-weight="700" text-anchor="middle">Programming (J1, 1×6)</text>
    <g font-size="14" fill="#cdd8ec">
      <text x="790" y="298">GND · 3V3 · EN · IO0 · TX0 · RX0</text>
      <text x="790" y="328">EN  ⟂ SW2 (reset)  + 10k pull-up</text>
      <text x="790" y="358">IO0 ⟂ SW3 (boot)   + 10k pull-up</text>
      <text x="790" y="388">Plug in any USB-UART (FTDI/CP2102)</text>
      <text x="790" y="428" fill="#8ea2c0">(No USB-serial chip on board — TP4056</text>
      <text x="790" y="448" fill="#8ea2c0"> USB-C is charge-only.)</text>
    </g>
  </g>

  <!-- ============ RIGHT: PHYSICAL PLACEMENT ============ -->
  <g transform="translate(770,520)">
    <text x="170" y="10" fill="#eaeef7" font-size="18" font-weight="700" text-anchor="middle">Board placement</text>

    <!-- TOP side -->
    <text x="170" y="45" fill="#8ea2c0" font-size="13" text-anchor="middle">TOP (component side)</text>
    <rect x="20" y="55" width="300" height="360" rx="8" fill="#10261a" stroke="#2f6b43" stroke-width="2"/>
    <!-- antennas -->
    <rect x="60" y="30" width="90" height="30" rx="4" fill="#22c55e" opacity="0.85"/>
    <rect x="190" y="30" width="90" height="30" rx="4" fill="#22c55e" opacity="0.85"/>
    <text x="170" y="22" fill="#22c55e" font-size="12" text-anchor="middle">▲ SMA antennas point up / out ▲</text>
    <rect x="55" y="70" width="100" height="70" rx="4" fill="#16321f" stroke="#22c55e"/>
    <text x="105" y="110" fill="#cdd8ec" font-size="12" text-anchor="middle">nRF #1</text>
    <rect x="185" y="70" width="100" height="70" rx="4" fill="#16321f" stroke="#22c55e"/>
    <text x="235" y="110" fill="#cdd8ec" font-size="12" text-anchor="middle">nRF #2</text>
    <rect x="90" y="165" width="160" height="150" rx="4" fill="#16223a" stroke="#3b82f6"/>
    <text x="170" y="245" fill="#cdd8ec" font-size="13" text-anchor="middle">ESP32-WROOM</text>
    <text x="170" y="263" fill="#8ea2c0" font-size="10" text-anchor="middle">keep antenna end at edge</text>
    <rect x="30" y="340" width="55" height="55" rx="4" fill="#2a2338" stroke="#a855f7"/>
    <text x="57" y="372" fill="#cdd8ec" font-size="10" text-anchor="middle">SW1</text>
    <rect x="255" y="340" width="55" height="25" rx="4" fill="#243043" stroke="#60a5fa"/>
    <text x="282" y="357" fill="#cdd8ec" font-size="9" text-anchor="middle">J1 UART</text>

    <!-- BOTTOM side -->
    <text x="170" y="455" fill="#8ea2c0" font-size="13" text-anchor="middle">BOTTOM (back side)</text>
    <rect x="20" y="465" width="300" height="360" rx="8" fill="#26170f" stroke="#6b452f" stroke-width="2"/>
    <rect x="45" y="500" width="250" height="90" rx="6" fill="#321f16" stroke="#ff8c42"/>
    <text x="170" y="550" fill="#cdd8ec" font-size="14" text-anchor="middle">18650 holder</text>
    <rect x="95" y="620" width="150" height="80" rx="6" fill="#321f16" stroke="#ff8c42"/>
    <text x="170" y="655" fill="#cdd8ec" font-size="13" text-anchor="middle">TP4056</text>
    <text x="170" y="675" fill="#8ea2c0" font-size="10" text-anchor="middle">USB-C at board edge</text>
    <rect x="120" y="720" width="100" height="26" rx="4" fill="#3a2a18" stroke="#ffd166"/>
    <text x="170" y="738" fill="#cdd8ec" font-size="11" text-anchor="middle">USB-C ◄ edge</text>
  </g>

  <text x="40" y="1460" fill="#5f7291" font-size="12">Pins use the ESP32 GPIO matrix (any GPIO works) and avoid strapping / flash / input-only pins. Adjust in firmware if you prefer.</text>
</svg>
